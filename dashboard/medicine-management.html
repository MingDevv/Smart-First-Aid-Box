<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บริหารจัดการคลังยา - Smart First Aid Box</title>
    <script>
        if (sessionStorage.getItem('dashboard_auth') !== 'true') {
            window.location.replace('./');
        }
    </script>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <style>
        .stock-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stock-control-btn {
            background: #334155;
            border: 1px solid #475569;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s ease;
        }

        .stock-control-btn:active {
            background: #475569;
            transform: scale(0.9);
        }

        .config-card {
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: var(--radius-md);
            padding: 20px;
            margin-bottom: 20px;
        }

        /* Simple Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: var(--radius-md);
            width: 100%;
            max-width: 400px;
            padding: 24px;
            position: relative;
        }
        
        .toggle-btn {
            background: none;
            border: none;
            color: #38BDF8;
            cursor: pointer;
            font-size: 12px;
            text-decoration: underline;
        }
    </style>
</head>
<body class="dashboard-body">

    <header class="dashboard-header">
        <div class="dashboard-title">
            <span>🏥 Smart First Aid | ครูพยาบาล</span>
        </div>
        <button class="btn btn-outline" style="width: auto; padding: 6px 14px; font-size: 12px; border-radius: var(--radius-sm); border-color: #334155; color: #94A3B8;" onclick="logout()">
            🚪 ออกจากระบบ
        </button>
    </header>

    <div class="container animate-fade-in" style="background: transparent;">
        <!-- Navigation Tabs -->
        <div class="dashboard-nav">
            <div class="nav-item" onclick="location.href='./'">ภาพรวม</div>
            <div class="nav-item" onclick="location.href='statistics'">สถิติ/รายงาน</div>
            <div class="nav-item active" onclick="location.href='medicine-management'">สต็อกตู้ยา</div>
        </div>

        <!-- Inventory List Section -->
        <div class="db-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
                <h3 style="font-size: 16px;">📦 รายการสต็อกยาและเวชภัณฑ์</h3>
                <button class="btn btn-primary" style="width:auto; padding: 8px 16px; font-size:12px; border-radius:var(--radius-sm);" onclick="openAddModal()">
                    ➕ เพิ่มยาใหม่
                </button>
            </div>
            
            <div class="med-list" id="medicine-list-container">
                <!-- Dynamic -->
            </div>
        </div>

        <!-- Configurations Section -->
        <div class="db-card">
            <h3 style="font-size: 16px; margin-bottom: 16px;">⚙️ ตั้งค่าระบบฮาร์ดแวร์และรหัสผ่าน (System Config)</h3>
            
            <form id="config-form" onsubmit="saveSystemConfig(event)">
                <div class="form-group">
                    <label class="form-label" style="color: #94A3B8;">IP / URL ควบคุมกล่องพยาบาล (ESP32):</label>
                    <input type="text" id="cfg-esp-url" class="form-input" style="background:#1E293B; border-color:#334155; color:white;" placeholder="เช่น http://192.168.1.100">
                </div>

                <div class="form-group">
                    <label class="form-label" style="color: #94A3B8;">รหัส PIN เข้าใช้ Dashboard ของครู (4 หลัก):</label>
                    <input type="text" id="cfg-pin" class="form-input" style="background:#1E293B; border-color:#334155; color:white;" maxlength="4" placeholder="1234">
                </div>

                <button type="submit" class="btn btn-primary" style="margin-top: 10px;">💾 บันทึกการตั้งค่าระบบ</button>
            </form>
        </div>
    </div>

    <!-- Add/Edit Medicine Modal -->
    <div class="modal" id="med-modal">
        <div class="modal-content animate-slide-up">
            <h3 style="margin-bottom: 16px;" id="modal-title">เพิ่มรายการยาพยาบาล</h3>
            <input type="hidden" id="med-id">

            <div class="form-group">
                <label class="form-label" style="color: #94A3B8;">ชื่อเวชภัณฑ์:</label>
                <input type="text" id="med-name" class="form-input" style="background:#0B0F19; border-color:#334155; color:white;" required>
            </div>

            <div class="form-group">
                <label class="form-label" style="color: #94A3B8;">จำนวนสต็อก:</label>
                <input type="number" id="med-qty" class="form-input" style="background:#0B0F19; border-color:#334155; color:white;" min="0" required>
            </div>

            <div class="form-group">
                <label class="form-label" style="color: #94A3B8;">หน่วยนับ:</label>
                <input type="text" id="med-unit" class="form-input" style="background:#0B0F19; border-color:#334155; color:white;" placeholder="เช่น ชิ้น, ขวด, ซอง" required>
            </div>

            <div class="form-group">
                <label class="form-label" style="color: #94A3B8;">วันหมดอายุ (EXP):</label>
                <input type="date" id="med-exp" class="form-input" style="background:#0B0F19; border-color:#334155; color:white;" required>
            </div>

            <div class="form-group">
                <label class="form-label" style="color: #94A3B8;">สต็อกขั้นต่ำที่ต้องแจ้งเตือน:</label>
                <input type="number" id="med-min" class="form-input" style="background:#0B0F19; border-color:#334155; color:white;" min="1" required>
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top: 20px;">
                <button class="btn btn-outline" style="border-color:#334155; color:white;" onclick="closeModal()">ยกเลิก</button>
                <button class="btn btn-primary" onclick="submitMedForm()">ตกลง</button>
            </div>
            
            <button id="delete-med-btn" class="btn btn-danger" style="margin-top: 12px; font-size:12px; padding:8px;" onclick="deleteCurrentMed()">🗑️ ลบรายการนี้</button>
        </div>
    </div>

    <footer class="app-footer" style="color: #64748B;">
        <p>© 2026 CRMS6 - Smart First Aid Box Project</p>
    </footer>

    <!-- Scripts -->
    <script src="../js/storage.js"></script>
    <script src="../js/notification.js"></script>
    <script>
        // Check Authentication status
        if (sessionStorage.getItem('dashboard_auth') !== 'true') {
            location.href = './';
        }

        function logout() {
            sessionStorage.removeItem('dashboard_auth');
            location.href = './';
        }

        const medContainer = document.getElementById("medicine-list-container");
        const modal = document.getElementById("med-modal");

        function escapeHtml(str) {
            if (typeof str !== 'string') return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Load Stock Data
        function renderMedicines() {
            medContainer.innerHTML = "";
            const medicines = StorageService.getMedicines();
            const now = new Date();

            medicines.forEach(med => {
                const isLow = med.qty <= med.minQty;
                
                // Expiry checks
                const expDate = new Date(med.exp);
                const isExpired = expDate <= now;
                const threeMonths = 90 * 24 * 60 * 60 * 1000;
                const isNearExpiry = !isExpired && (expDate - now) < threeMonths;

                let statusBadgeHtml = "";
                if (isExpired) {
                    statusBadgeHtml = `<span class="status-badge status-expired">หมดอายุ</span>`;
                } else if (isNearExpiry) {
                    statusBadgeHtml = `<span class="status-badge status-warning">ใกล้หมดอายุ</span>`;
                }

                const item = document.createElement("div");
                item.className = "med-item";
                
                const thaiDate = new Date(med.exp).toLocaleDateString('th-TH', {year:'numeric', month:'short', day:'numeric'});
                const safeName = escapeHtml(med.name);
                const safeUnit = escapeHtml(med.unit);

                item.innerHTML = `
                    <div class="med-info" style="cursor:pointer;">
                        <div class="med-name">
                            <span>${safeName}</span>
                            ${statusBadgeHtml}
                        </div>
                        <div class="med-expiry">📅 หมดอายุ: ${thaiDate}</div>
                    </div>
                    <div class="stock-control">
                        <button class="stock-control-btn btn-minus">-</button>
                        <div class="med-stock">
                            <span class="med-qty ${isLow ? 'low-stock' : ''}">${med.qty}</span>
                            <span style="font-size:11px; color:#94A3B8;">${safeUnit}</span>
                        </div>
                        <button class="stock-control-btn btn-plus">+</button>
                    </div>
                `;

                // Safe event listeners without JSON in inline attributes (BUG-04 Fix)
                item.querySelector('.med-info').addEventListener('click', () => openEditModal(med));
                item.querySelector('.btn-minus').addEventListener('click', (e) => {
                    e.stopPropagation();
                    updateQty(med.id, -1);
                });
                item.querySelector('.btn-plus').addEventListener('click', (e) => {
                    e.stopPropagation();
                    updateQty(med.id, 1);
                });

                medContainer.appendChild(item);
            });
        }

        // Quick update quantity
        function updateQty(id, change) {
            const medicines = StorageService.getMedicines();
            const med = medicines.find(m => m.id === id);
            if (med) {
                const newQty = Math.max(0, med.qty + change);
                StorageService.updateMedicine(id, { qty: newQty });
                renderMedicines();
            }
        }

        // Modal Operations
        function openAddModal() {
            document.getElementById("modal-title").innerText = "เพิ่มรายการยาพยาบาล";
            document.getElementById("med-id").value = "";
            document.getElementById("med-name").value = "";
            document.getElementById("med-qty").value = "";
            document.getElementById("med-unit").value = "";
            document.getElementById("med-exp").value = "";
            document.getElementById("med-min").value = "5";
            document.getElementById("delete-med-btn").style.display = "none";
            modal.style.display = "flex";
        }

        function openEditModal(med) {
            document.getElementById("modal-title").innerText = "แก้ไขรายการยาพยาบาล";
            document.getElementById("med-id").value = med.id;
            document.getElementById("med-name").value = med.name;
            document.getElementById("med-qty").value = med.qty;
            document.getElementById("med-unit").value = med.unit;
            document.getElementById("med-exp").value = med.exp;
            document.getElementById("med-min").value = med.minQty;
            document.getElementById("delete-med-btn").style.display = "block";
            modal.style.display = "flex";
        }

        function closeModal() {
            modal.style.display = "none";
        }

        // Add/Update Submit
        function submitMedForm() {
            const id = document.getElementById("med-id").value;
            const name = document.getElementById("med-name").value;
            const qty = Number(document.getElementById("med-qty").value);
            const unit = document.getElementById("med-unit").value;
            const exp = document.getElementById("med-exp").value;
            const minQty = Number(document.getElementById("med-min").value);

            if (!name || isNaN(qty) || !unit || !exp || isNaN(minQty)) {
                NotificationService.showToast("กรุณากรอกข้อมูลให้ครบถ้วน", "danger");
                return;
            }

            const data = { name, qty, unit, exp, minQty };

            if (id) {
                // Update
                StorageService.updateMedicine(id, data);
                NotificationService.showToast("อัปเดตข้อมูลสำเร็จ!", "success");
            } else {
                // Add
                StorageService.addMedicine(data);
                NotificationService.showToast("เพิ่มเวชภัณฑ์ยาใหม่สำเร็จ!", "success");
            }

            closeModal();
            renderMedicines();
        }

        // Delete item
        function deleteCurrentMed() {
            const id = document.getElementById("med-id").value;
            if (id && confirm("คุณแน่ใจว่าต้องการลบรายการเวชภัณฑ์นี้ออกจากตู้ยา?")) {
                StorageService.deleteMedicine(id);
                NotificationService.showToast("ลบเวชภัณฑ์เรียบร้อยแล้ว", "success");
                closeModal();
                renderMedicines();
            }
        }

        // Config form saving
        function loadSystemConfig() {
            const settings = StorageService.getSettings();
            const espElem = document.getElementById("cfg-esp-url");
            const pinElem = document.getElementById("cfg-pin");
            if (espElem) espElem.value = settings.esp32Url || settings.esp8266Url || "http://192.168.1.100";
            if (pinElem) pinElem.value = settings.dashboardPin || "1234";
        }

        function saveSystemConfig(event) {
            event.preventDefault();
            const settings = StorageService.getSettings();
            const esp32Url = (document.getElementById("cfg-esp-url")?.value || "").trim();
            const dashboardPin = (document.getElementById("cfg-pin")?.value || "1234").trim();

            if (dashboardPin.length !== 4 || isNaN(Number(dashboardPin))) {
                NotificationService.showToast("รหัส PIN แดชบอร์ดต้องเป็นตัวเลข 4 หลัก", "danger");
                return;
            }

            StorageService.saveSettings({
                ...settings,
                esp32Url,
                dashboardPin
            });

            NotificationService.showToast("บันทึกการตั้งค่าระบบเรียบร้อยแล้ว", "success");
        }

        // Toggle inputs password/text
        function toggleInputVisibility(id) {
            const elem = document.getElementById(id);
            if (elem.type === "password") {
                elem.type = "text";
            } else {
                elem.type = "password";
            }
        }

        // On Load
        document.addEventListener("DOMContentLoaded", () => {
            renderMedicines();
            loadSystemConfig();
        });
    </script>
</body>
</html>
