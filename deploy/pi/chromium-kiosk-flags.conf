# Chromium command line for the Smart First Aid Box cabinet kiosk.
#
# STATUS: NEVER APPLIED. No Chromium on hardware has been started with these flags.
#         Flag names were written from the documented Chromium switch list, not from a
#         `chromium --help` on the device. Unknown switches are IGNORED by Chromium
#         (logged, not fatal), so a stale name degrades quietly rather than breaking
#         boot — which also means a typo here is invisible. Verify the ones marked
#         VERIFY at chrome://version (the "Command Line" row shows what actually ran).
#
# Install: /etc/sfab/chromium-kiosk-flags.conf   (root:root 0644)
# Read by: /usr/local/lib/sfab/sfab-kiosk-run.sh — one flag per line, '#' comments and
#          blank lines skipped, no shell quoting, no trailing comments on a flag line.
# The URL is NOT here; it comes from SFAB_KIOSK_URL in sfab-kiosk.service.
#
# ─────────────────────────────────────────────────────────────────────────────
# THE SANDBOX STAYS ON.
# --no-sandbox is never in this file. sfab-kiosk-run.sh refuses to start if it finds
# it. This page holds a live camera stream and POSTs to an endpoint that drives a
# stepper motor; the renderer sandbox is the boundary between "a web bug" and "a
# cabinet that opens on command". Running Chromium as a normal user (the kiosk unit
# does) keeps the sandbox working with no flag needed. If Chromium refuses to start
# and demands --no-sandbox, the cause is running it as root — fix the user, not this.
# ─────────────────────────────────────────────────────────────────────────────

# ── Kiosk shell ──────────────────────────────────────────────────────────────
# Fullscreen, no omnibox, no tab strip, no window controls.
--kiosk

# ── First-run / bubbles / infobars ───────────────────────────────────────────
# Suppress the first-run wizard and the "make Chromium your default browser" prompt.
--no-first-run
--no-default-browser-check

# Suppress the "Chromium didn't shut down correctly — Restore pages?" bubble. This one
# matters more than it sounds: the kiosk unit uses Restart=always, so every unclean
# exit would otherwise leave a modal sitting on top of the first-aid UI. Paired with
# the RestoreOnStartup=4 policy in chromium-policies.json.
--disable-session-crashed-bubble

# Suppress error dialogs that would sit unanswered in front of a student.
--noerrdialogs

# VERIFY: --disable-infobars has been only partially effective for several Chromium
# releases (some infobars ignore it). Kept because it still suppresses some, but do not
# treat it as a guarantee — do the escape-key sweep in README.md and look for strips
# appearing at the top of the page.
--disable-infobars

# VERIFY: newer Chromium only (the EU search-engine choice screen). Harmless and
# ignored on builds that predate it.
--disable-search-engine-choice-screen

# Translate. Both feature names are listed for version coverage; the authoritative
# control is the TranslateEnabled policy in chromium-policies.json.
--disable-features=Translate,TranslateUI

# ── Login/keyring ────────────────────────────────────────────────────────────
# An autologin kiosk session has no unlocked keyring. Without this, Chromium can block
# on a "unlock your keyring" prompt that nobody will ever type a password into.
--password-store=basic

# ── Offline behaviour ────────────────────────────────────────────────────────
# The cabinet must come up with the internet unplugged (docs/PI_LOCAL_SETUP.md).
# Stop Chromium from spending startup on update checks and background phone-homes.
--disable-component-update
--disable-background-networking

# ── Touchscreen behaviour (5-inch 800x480 resistive, single touch) ───────────
# Kill the edge-swipe that navigates back/forward. On a resistive panel where a student
# drags a fingertip across the frame, this is the most likely accidental navigation.
--overscroll-history-navigation=0

# No pinch-zoom. The page already sets user-scalable=no, but that is a page-level hint;
# this is the browser-level one.
--disable-pinch

# VERIFY on the device: pin CSS pixels 1:1 to the 800x480 panel. If text comes out the
# wrong size, this is the first line to change — and re-run the touch alignment check,
# because scale and touch mapping are easy to confuse for each other.
--force-device-scale-factor=1

# VERIFY: forces touch event support on regardless of detection. Only needed if the
# panel is detected late; remove it if touch already works, fewer overrides is better.
--touch-events=enabled

# ── Wayland / labwc ──────────────────────────────────────────────────────────
# VERIFY FIRST — this is the flag most likely to stop Chromium launching at all.
# Under labwc (Wayland), native Wayland avoids an XWayland round trip. Raspberry Pi OS
# builds vary in whether they prefer --ozone-platform=wayland or
# --ozone-platform-hint=auto. If Chromium does not appear, comment this line out and
# retry before changing anything else.
--ozone-platform=wayland

# ── Camera ───────────────────────────────────────────────────────────────────
# js/kiosk-app.js calls getUserMedia({ video: true, audio: false }). http://localhost
# is a secure context, so the API is available over plain HTTP here — no certificate
# work is needed. What IS needed is a permission grant, and there are two ways:
#
#   (A) --use-fake-ui-for-media-stream
#       Auto-accepts every getUserMedia prompt. Simple, no root file needed.
#   (B) Managed policy VideoCaptureAllowedUrls (see chromium-policies.json)
#       Auto-grants video capture to listed origins only.
#
# RECOMMENDATION: (B), the managed policy. Four reasons:
#   1. Least privilege. (A) grants BOTH microphone and camera, to EVERY origin, for
#      every request. This app asks for video only and needs exactly one origin.
#   2. Scope. If the browser ever ends up somewhere other than the kiosk page, (A) hands
#      that page the camera silently. (B) does not.
#   3. Auditability. A managed policy is visible at chrome://policy and survives a
#      profile reset. A switch buried in a flags file is invisible to anyone reviewing
#      the running browser.
#   4. The recording indicator. (A) is a test-automation switch; on some builds it also
#      suppresses the in-use UI. In a school, removing the one visible signal that a
#      camera is live is the wrong default.
# The only argument for (A) is that it needs no root-owned file in /etc — which is not
# an argument on a device we are already provisioning as root.
#
# Therefore --use-fake-ui-for-media-stream is intentionally left commented out. Use it
# only as a temporary diagnostic to prove that a camera failure is a PERMISSION problem
# rather than a driver problem, then remove it again.
#--use-fake-ui-for-media-stream
#
# Note on the origin: the kiosk opens http://localhost:8787/kiosk, so the permission
# origin is http://localhost:8787. http://127.0.0.1:8787 is a DIFFERENT origin to
# Chromium's permission store even though it reaches the same server. If Chromium falls
# back to ::1 then 127.0.0.1 at the socket layer, the origin string does not change —
# so do not "fix" a camera problem by swapping the URL to 127.0.0.1 without also adding
# that origin to VideoCaptureAllowedUrls.
#
# If the grant never lands, the kiosk still works: kiosk-app.js catches the failure and
# routes the student to manual wound selection. A broken camera is a degraded cabinet,
# not a dead one. Confirm that path during acceptance rather than assuming it.

# MediaStream playback into <video autoplay muted> is normally allowed without this;
# it is here because a silent autoplay block looks exactly like a broken camera.
--autoplay-policy=no-user-gesture-required

# ── Optional / debugging (leave commented in production) ─────────────────────
# Windowed, for working on the Pi over VNC or with a keyboard attached. Remove --kiosk
# above when using these, or they do nothing.
#--window-size=800,480
#--window-position=0,0
# Only if Chromium reports /dev/shm exhaustion; costs performance, so do not pre-apply.
#--disable-dev-shm-usage
# Hides scrollbars entirely. The kiosk layout is fixed-size, but confirm no view needs
# to scroll before enabling this — a hidden scrollbar on a view that does scroll is an
# invisible dead end.
#--hide-scrollbars
