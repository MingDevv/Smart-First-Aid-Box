# บอกตำแหน่งพอร์ต USB ของ micro:bit V1.5 ให้บริการ sfab-edge
# ติดตั้งที่ ~/.config/systemd/user/sfab-edge.service.d/20-serial.conf
#
# ใช้ path แบบ by-id เพราะมันไม่เปลี่ยนตอนถอดเสียบใหม่ ส่วน /dev/ttyACM0 เปลี่ยนได้
# edge/server.mjs เปิดพอร์ตนี้ก่อนเปิดเซิร์ฟเวอร์ ตู้ที่ยังไม่ได้เสียบบอร์ดจะได้ล้มให้เห็น
# ไม่ใช่เปิดจอค้างไว้แล้วขึ้นว่าต่อตู้ไม่ได้ตลอดเวลา
#
# ลบไฟล์นี้แล้ว restart = ตู้ทำงานแบบไม่มีฮาร์ดแวร์ (สถานะจะขึ้น configured:false)
[Service]
Environment=SFAB_SERIAL=/dev/serial/by-id/usb-ARM_BBC_micro:bit_CMSIS-DAP_9901000053834e45005a8005000000420000000097969901-if01
