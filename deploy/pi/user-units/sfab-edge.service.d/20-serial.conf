# micro:bit V1.5 over USB CDC. Installed on the cabinet 2026-09-12 at
# ~/.config/systemd/user/sfab-edge.service.d/20-serial.conf (next to 10-mode.conf from
# sfab-set-mode.sh). The by-id path survives re-enumeration; /dev/ttyACM0 does not.
#
# edge/server.mjs opens this device BEFORE listening, so an unplugged board makes the unit
# fail loudly instead of serving a kiosk that says "ตู้ยังต่อไม่ได้" forever.
# Remove this file and restart to run with no actuator path (status: configured:false).
[Service]
Environment=SFAB_SERIAL=/dev/serial/by-id/usb-ARM_BBC_micro:bit_CMSIS-DAP_9901000053834e45005a8005000000420000000097969901-if01
